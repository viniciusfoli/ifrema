<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>A-Frame AR (AR.js - marker)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js para A-Frame (marker-based) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <style>body, html { margin:0; overflow:hidden; }</style>
  </head>
  <body>
    <!-- 'embedded' remove o modo tela cheia; 'arjs' ativa a webcam -->
    <a-scene embedded arjs>
      <!-- Usa o marcador 'hiro' padrão -->
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" material="color: #FF6; metalness: 0.2; roughness: 0.8"></a-box>
        <a-text value="XRLab!" position="-0.5 1.2 0" rotation="-90 0 0" color="#222"></a-text>
      </a-marker>
      <a-box 
            grabbable
            position="-1 0.5 -3" 
            color="#4CC3D9" 
            animation="property:rotation; from: 0 0 0; to: 360 360 0; dur:2000; startEvents:click;">

      <a-camera position="0 1 0" far="10000" fov="80" look-controls-enabled="true" near="0.5" reverse-mouse-drag="false" wasd-controls-enabled="true"></a-camera>
      
      <!-- Câmera AR -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Dica: imprima o marcador 'hiro' (busque por 'hiro marker pdf') e mostre à webcam -->
  </body>
</html>
